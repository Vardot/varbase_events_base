################################################################################
# Build + validate + functional test GitLab CI for the Varbase Events Base
# recipe.
#
# build/validate mirror the Varbase project template (composer validate + YAML
# lint). The test stage assembles a Varbase site that applies this recipe
# through a Site-template recipe (Varbase Starter + Varbase Events Base), serves
# it with the PHP built-in server, seeds the test users and a small event
# fixture, and runs the webship-js (Playwright + Cucumber-js) suite against it.
################################################################################

stages:
  - build
  - validate
  - test

variables:
  DRUPAL_CORE: "11.4.0"
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"
  # git.drupalcode.org clones can be slow from a runner; give composer git
  # operations room instead of the 300s default so a slow fetch is not a failure.
  COMPOSER_PROCESS_TIMEOUT: "1800"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# = build = validate the recipe's composer.json (schema + metadata, offline).
build:composer-validate:
  stage: build
  image: composer:2
  script:
    - composer --version
    - composer validate --no-check-all --no-check-publish

# = validate = lint every YAML file (recipe.yml + config/*) for syntax errors.
validate:yaml-lint:
  stage: validate
  image: python:3.12-slim
  script:
    - python --version
    - pip install --quiet pyyaml
    - |
      python - <<'PY'
      import glob, sys, yaml
      bad = 0
      for f in sorted(glob.glob('**/*.yml', recursive=True)):
          if f.startswith('node_modules/'):
              continue
          try:
              list(yaml.safe_load_all(open(f, encoding='utf-8')))
          except Exception as e:
              print('YAML ERROR:', f, '->', e); bad += 1
      print('Checked YAML files; errors:', bad)
      sys.exit(1 if bad else 0)
      PY

# = test = webship-js functional tests against a freshly built Varbase + Events
#          Base site. One self-contained job (build -> serve -> seed -> test).
"🧪 Automated Functional Testing":
  stage: test
  # Apache + mod_php (not php:8.4-cli): the PHP built-in server that `drush
  # runserver` uses truncates large streamed responses (ERR_CONTENT_LENGTH_
  # MISMATCH), which corrupted the CKEditor 5 bundle and the media-library
  # AJAX. A real webserver serves them intact.
  image: php:8.4-apache
  services:
    - name: mariadb:11
      alias: database
  variables:
    MYSQL_DATABASE: "drupal"
    MYSQL_USER: "drupal"
    MYSQL_PASSWORD: "drupal"
    MYSQL_ROOT_PASSWORD: "root"
    SITE_DIR: "${CI_PROJECT_DIR}/.site"
    WEB_ROOT: "${CI_PROJECT_DIR}/.site/web"
    DB_URL: "mysql://drupal:drupal@database/drupal"
    LAUNCH_URL: "http://127.0.0.1"
    ADMIN_NAME: "webmaster"
    ADMIN_PASS: "dD.123123ddd"
    ADMIN_MAIL: "webmaster@vardot.com"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
  before_script:
    # System + PHP tooling.
    - apt-get update -y
    # imagemagick provides the `identify`/`convert` binaries the Varbase Media
    # Base ImageMagick toolkit shells out to when building image derivatives;
    # librsvg2-bin provides the `rsvg-convert` delegate ImageMagick uses to read
    # the demo SVG icons. Without either, image-bearing pages 500.
    - apt-get install -y --no-install-recommends git unzip curl jq default-mysql-client imagemagick librsvg2-bin
        libzip-dev libpng-dev libjpeg-dev libwebp-dev libfreetype6-dev libonig-dev
    - docker-php-ext-configure gd --with-jpeg --with-webp --with-freetype
    - docker-php-ext-install -j"$(nproc)" gd pdo_mysql zip opcache pcntl
    - echo "memory_limit=-1" > /usr/local/etc/php/conf.d/zz-memory.ini
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    # Assemble a Varbase project and require the recipe under test from a path repo.
    # --no-scripts skips the varbase drupal-libraries yarn sync (ace, dropzone, …),
    # which the events tests do not exercise; the scaffold plugin still runs on
    # composer install below.
    # Make git clones resilient to a flaky runner network (RPC/stream resets).
    - git config --global http.version HTTP/1.1
    - git config --global http.postBuffer 1048576000
    - git config --global http.lowSpeedLimit 1000
    - git config --global http.lowSpeedTime 300
    - composer create-project drupal/varbase_project:11.0.x-dev "$SITE_DIR" --no-interaction --no-install --no-scripts
    - cd "$SITE_DIR"
    - composer config allow-plugins true -n
    - composer config minimum-stability dev
    - composer config repositories.events_base path "$CI_PROJECT_DIR"
    # TEMPORARY: the events listing view uses the components_exposed_form views
    # exposed-form plugin, which is added by Varbase Components MR !46
    # (https://git.drupalcode.org/project/varbase_components/-/merge_requests/46,
    # issue #3611182) but is not yet in 4.0.x. Pull varbase_components from the
    # issue-fork branch until that MR merges, then delete these two lines and let
    # it resolve from 4.0.x-dev again.
    - composer config repositories.varbase_components_fork vcs https://git.drupalcode.org/issue/varbase_components-3611182.git
    # Retry the require/install — git.drupalcode.org clones intermittently reset
    # (RPC failed / stream not closed) on a runner, and a single hiccup should
    # not fail the build.
    - |
      for i in 1 2 3 4 5; do
        composer require "drupal/varbase_components:dev-3611182-components-exposed-form as 4.0.x-dev" "drupal/varbase_events_base:@dev" drush/drush:^13 -W --no-interaction && break
        echo "composer require attempt $i failed — retrying in 15s"; sleep 15
      done
    - |
      for i in 1 2 3 4 5; do
        composer install --no-interaction && break
        echo "composer install attempt $i failed — retrying in 15s"; sleep 15
      done
    # Populate web/libraries (ckeditor5 media-embed, dropzone, …) via the
    # varbase_project `postinstall` sync. Without it CKEditor 5 fails to
    # initialise (missing media-embed plugin) and the media library breaks
    # (missing dropzone), which sinks the Body and featured-image scenarios.
    - corepack enable || true
    - YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install --network-timeout 600000
    # Make the synced libraries world-readable so Apache (www-data) can serve
    # them — yarn creates them as root, and a missing ckeditor5 media-embed
    # asset breaks the rich-text editor.
    - chmod -R a+rX "$WEB_ROOT/libraries" || true
    - echo "media-embed build:"; ls -la "$WEB_ROOT/libraries/ckeditor5/plugins/media-embed/build/" 2>&1 | tail -3
    # Compose a Site-template recipe (Varbase Starter installs Vartheme BS5, then
    # the recipe under test) and install it. Applied during install, so the
    # recipe's Canvas actions run with the theme's components already generated.
    - mkdir -p "$SITE_DIR/recipes/events_base_test"
    - |
      cat > "$SITE_DIR/recipes/events_base_test/recipe.yml" <<'RECIPE'
      name: "Events Base Test"
      description: "Varbase Starter plus Varbase Events Base, for functional testing."
      type: Site
      recipes:
        - varbase_starter
        - varbase_events_base
      RECIPE
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" site:install "$SITE_DIR/recipes/events_base_test" --db-url="$DB_URL" --account-name="$ADMIN_NAME" --account-pass="$ADMIN_PASS" --account-mail="$ADMIN_MAIL" --site-name="Events Base Test" --locale=en -y
    # Test-ready prep: no antibot, no aggregation. Uninstall Big Pipe — its
    # server-side placeholder sub-requests deadlock the single PHP built-in
    # server thread (500s); the workers env below is the primary guard.
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" pm:uninstall antibot -y || true
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" pm:uninstall big_pipe -y || true
    # Security Kit sets a Content-Security-Policy that blocks the CKEditor 5
    # Plugin Pack / Premium Features scripts (loaded from cdn.ckeditor.com),
    # causing "plugincollection-plugin-not-found {plugin: null}" and a dead Body
    # editor. Uninstall it for the headless test run (like antibot).
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" pm:uninstall seckit -y || true
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" config:set system.performance css.preprocess 0 -y || true
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" config:set system.performance js.preprocess 0 -y || true
    # Seed the testing users. The account NAME must be the human role label
    # (e.g. "Content editor") because cucumber.js logs in by that label; the
    # mails mirror .ddev/commands/web/assets/varbase.users.yml.
    - |
      seed_user() { # $1=name  $2=mail  $3=role (empty for none)
        bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" user:create "$1" --mail="$2" --password="dD.123123ddd" || true
        [ -n "$3" ] && bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" user:role:add "$3" "$1" || true
      }
      seed_user "Normal user"    "test.authenticated@vardot.com"  ""
      seed_user "Content editor" "test.content_editor@vardot.com" "content_editor"
      seed_user "Content admin"  "test.content_admin@vardot.com"  "content_admin"
      seed_user "SEO admin"      "test.seo_admin@vardot.com"      "seo_admin"
      seed_user "Site admin"     "test.site_admin@vardot.com"     "site_admin"
      seed_user "Super admin"    "test.super_admin@vardot.com"    "administrator"
    # Seed the deterministic test content (15 example events, a shared tag and a
    # sample image media) that the listing / pager / filter / related-events /
    # featured-image scenarios assert against — a testing-only recipe, applied
    # here with `drush recipe`, not a PHP fixture.
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" recipe "$CI_PROJECT_DIR/tests/recipes/varbase_events_base_test_content"
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" cache:rebuild
    # Point Apache at the Drupal docroot, honour its .htaccess (clean URLs) and
    # let www-data read the built site.
    - sed -ri "s!DocumentRoot /var/www/html!DocumentRoot ${WEB_ROOT}!g" /etc/apache2/sites-available/000-default.conf
    - printf '<Directory %s>\n  Options FollowSymLinks\n  AllowOverride All\n  Require all granted\n</Directory>\n' "$WEB_ROOT" > /etc/apache2/conf-available/drupal-docroot.conf
    - a2enconf drupal-docroot && a2enmod rewrite
    - chown -R www-data:www-data "$WEB_ROOT/sites/default/files" || true
    # Test toolchain.
    - cd "$CI_PROJECT_DIR"
    - npm install --no-audit --no-fund
    - npx playwright install --with-deps chromium
  script:
    # Serve the site with Apache + mod_php (a real webserver — no built-in-server
    # response truncation). Start it as a daemon so it stays up for cucumber.
    - apache2ctl start || service apache2 start
    - for i in $(seq 1 45); do curl -sf -o /dev/null "$LAUNCH_URL/" && break; sleep 2; done
    - curl -sf -o /dev/null "$LAUNCH_URL/" || { echo "site not serving:"; apache2ctl -S 2>&1 | tail -20; tail -30 /var/log/apache2/error.log 2>/dev/null; exit 1; }
    # Verbose errors so a 500 renders its exception + backtrace inline, then
    # clear the watchdog so the health-check below shows only fresh errors.
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" config:set system.logging error_level verbose -y || true
    - bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" watchdog:delete all -y || true
    # Health-check the events listing before the suite: a non-200 here means the
    # recipe left a broken view, so fail fast and surface the real error instead
    # of a wall of red scenarios.
    - EV=$(curl -s -o /tmp/events.html -w "%{http_code}" "$LAUNCH_URL/events"); echo "/events -> HTTP $EV"
    - |
      if [ "$EV" != "200" ]; then
        echo "The /events listing did not return 200 — page exception:"
        grep -aioE "(PluginNotFoundException|Exception[^<]{0,180}|Error:[^<]{0,180}|in [^ <]+\.php on line [0-9]+|does not exist[^<]{0,120}|no such[^<]{0,120})" /tmp/events.html | head -15 || true
        echo "--- fresh watchdog errors ---"
        bash "$SITE_DIR/bin/drush" --root="$WEB_ROOT" watchdog:show --count=10 --severity=Error 2>&1 | tail -30 || true
        exit 1
      fi
    - cd "$CI_PROJECT_DIR"
    - BROWSER=chromium node ./node_modules/@cucumber/cucumber/bin/cucumber.js --config cucumber.js --tags "not @wip" --retry 1
